services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pipocalizando-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      PORT: 3333
      JWT_SECRET: dev-jwt-secret-pipocalizando
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:3000
      MERCADO_PAGO_ACCESS_TOKEN: ""
      MERCADO_PAGO_PUBLIC_KEY: ""
      MERCADO_PAGO_PAYER_EMAIL_OVERRIDE: ""
      MERCADO_PAGO_CHECKOUT_MODE: production
      MERCADO_PAGO_WEBHOOK_URL: ""
      MERCADO_PAGO_WEBHOOK_SECRET: ""
    ports:
      - "3333:3333"
    volumes:
      - backend_uploads:/app/backend/uploads
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3333/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: pipocalizando-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_uploads:
